[package]
name = "cofre-core"
description = "Protocolo, criptografia e modelo do cofre — sem dependência de UI."
version.workspace = true
edition.workspace = true

[dependencies]
aes = "0.9.4"
argon2 = "0.6.0"
base64.workspace = true
cbc = "0.2.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
rsa = "0.10.0"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror.workspace = true
uuid = { version = "1.29.2", features = ["v4"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
