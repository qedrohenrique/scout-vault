# cargo-deny: falhas conhecidas (RustSec), licenças, crates proibidos e origem
# das dependências. Rode localmente com `cargo deny check`.

[graph]
# O app é só Windows por enquanto; o núcleo também roda no Linux (testes ao vivo do CI).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
# Vulnerabilidades e "unsound" falham em qualquer dependência. "Sem manutenção" só
# conta nas dependências diretas: as indiretas (do gpui) não dá para trocar daqui.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Licenças permissivas compatíveis com a licença do projeto.
allow = [
    "MIT",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# As crates do próprio workspace usam `path` com versão; não contam como curinga.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
