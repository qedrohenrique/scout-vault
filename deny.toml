# cargo-deny: known vulnerabilities (RustSec), licenses, banned crates and the
# origin of dependencies. Run locally with `cargo deny check`.

[graph]
# The app is Windows-only for now; the core also runs on Linux (CI live tests).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
# Vulnerabilities and "unsound" fail on any dependency. "Unmaintained" only counts
# for direct dependencies: the indirect ones (from gpui) can't be swapped from here.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses compatible with the project's license.
allow = [
    "MIT",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates use `path` with a version; they don't count as wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
