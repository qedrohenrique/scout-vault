# Local Vaultwarden for development ONLY. Do not expose it on the network.
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: cofre-dev-vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    environment:
      DOMAIN: "http://localhost:8000"
      SIGNUPS_ALLOWED: "true"
      LOG_LEVEL: "info"
    volumes:
      - ./vw-data:/data
