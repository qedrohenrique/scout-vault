name: Release

# Publishing a version:
#   1. In CHANGELOG.md, replace "## [Unreleased]" with "## [X.Y.Z] - YYYY-MM-DD"
#      (and open a new empty "Unreleased" section above it, if you like).
#   2. Put the same version in [workspace.package] in Cargo.toml (and in the extension manifest).
#   3. Commit, `git tag vX.Y.Z` and `git push origin vX.Y.Z`.
# This workflow tests, builds, packages and creates the release with the notes from
# that CHANGELOG section. 0.x versions ship as pre-releases.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Notes first: if the tag doesn't match Cargo.toml or the CHANGELOG section
      # is missing, stop here before spending minutes compiling.
      - name: Release notes (CHANGELOG.md)
        shell: bash
        run: python tools/release_notes.py "${GITHUB_REF_NAME}" --out release-notes.md
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p scout-vault-app
      - name: Package
        shell: bash
        run: python tools/package_release.py "${GITHUB_REF_NAME}" --out dist
      # Store packages of the browser extension (Chrome Web Store / Edge Add-ons and Firefox).
      - name: Extension packages
        shell: bash
        run: python tools/package_extension.py "${GITHUB_REF_NAME}" --out dist
      # Per-user installer (no administrator): Start menu, "Installed apps",
      # start with Windows and clean uninstall. Inno Setup comes from Chocolatey
      # when the runner image doesn't have it.
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $iscc "/DAppVersion=$version" installer\scout-vault.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $name = "scout-vault-$version-setup.exe"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash *$name" | Out-File -Encoding ascii -NoNewline "dist\$name.sha256"
      # winget manifests (submitted by hand to microsoft/winget-pkgs), kept as a workflow artifact.
      - name: winget manifests
        shell: bash
        run: python tools/winget_manifest.py "${GITHUB_REF_NAME}" --out winget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget
          path: winget/
          if-no-files-found: error
      # Unsigned: this job compiles third-party code, so it never sees the signing key.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
            release-notes.md
          if-no-files-found: error

  sign:
    name: Sign (Ed25519)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The key is a secret of the `release` environment (Settings → Environments: required
    # reviewers, deployments only from `v*` tags). This job builds, caches and installs
    # nothing: it takes the build's files, signs them with OpenSSL (tools/sign_release.sh)
    # and hands back only the `.sig` files. The in-app updater runs only an installer whose
    # `.release.sig` matches its name and version; without the key this job fails, so
    # nothing is published unsigned.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/sign_release.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash tools/sign_release.sh "${GITHUB_REF_NAME}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: dist/*.sig
          if-no-files-found: error

  publish:
    name: Publish on GitHub
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job writes to the repository (it creates the release).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          flags=()
          # 0.x = test version.
          if [[ "$version" == 0.* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "Scout Vault $version" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            dist/*.exe dist/*.zip dist/*.sha256 dist/*.sig
