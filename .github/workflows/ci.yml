name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: no job here needs to write to the repository.
permissions:
  contents: read

# A new push cancels the previous run on the same branch (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  windows:
    name: Clippy and tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Core + headless UI (live tests are left out: they are #[ignore]).
      - run: cargo test --workspace --locked

  live:
    name: Live tests (Vaultwarden)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Throwaway Vaultwarden just for this job; the account is created here and goes away with it.
    services:
      vaultwarden:
        image: vaultwarden/server:latest
        ports:
          - 8000:80
        env:
          DOMAIN: http://localhost:8000
          SIGNUPS_ALLOWED: "true"
          # The tests log in several times in a row.
          LOGIN_RATELIMIT_SECONDS: "1"
          LOGIN_RATELIMIT_MAX_BURST: "1000"
          # Newer versions refuse to start without a volume at /data; here the
          # server is throwaway on purpose.
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Wait for Vaultwarden
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/alive && exit 0
            sleep 2
          done
          echo "Vaultwarden did not respond" >&2
          exit 1
      - name: Create test account and organization
        run: |
          python tools/dev_seed.py --url http://localhost:8000
          python tools/dev_org.py
          . dev/test-account.env
          echo "::add-mask::$SCOUT_VAULT_TEST_PASSWORD"
          cat dev/test-account.env >> "$GITHUB_ENV"
      - run: cargo test -p scout-vault-core --locked
      - name: Tests against the server
        run: cargo test -p scout-vault-core --test live_server --locked -- --ignored --test-threads=1

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: JavaScript and manifest syntax
        run: |
          for f in extension/*.js; do node --check "$f"; done
          python3 -m json.tool extension/manifest.json > /dev/null
