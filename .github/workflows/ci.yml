name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Só leitura: nenhum job aqui precisa escrever no repositório.
permissions:
  contents: read

# Um push novo cancela a execução anterior do mesmo branch (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  windows:
    name: Clippy e testes (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Núcleo + interface headless (os testes ao vivo ficam de fora: são #[ignore]).
      - run: cargo test --workspace --locked

  live:
    name: Testes ao vivo (Vaultwarden)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Vaultwarden descartável só para este job; a conta é criada aqui e some junto.
    services:
      vaultwarden:
        image: vaultwarden/server:latest
        ports:
          - 8000:80
        env:
          DOMAIN: http://localhost:8000
          SIGNUPS_ALLOWED: "true"
          # Os testes fazem vários logins seguidos.
          LOGIN_RATELIMIT_SECONDS: "1"
          LOGIN_RATELIMIT_MAX_BURST: "1000"
          # Versões novas recusam subir sem volume em /data; aqui o servidor é
          # descartável de propósito.
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Esperar o Vaultwarden
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/alive && exit 0
            sleep 2
          done
          echo "o Vaultwarden não respondeu" >&2
          exit 1
      - name: Criar conta e organização de teste
        run: |
          python tools/dev_seed.py --url http://localhost:8000
          python tools/dev_org.py
          . dev/test-account.env
          echo "::add-mask::$SCOUT_VAULT_TEST_PASSWORD"
          cat dev/test-account.env >> "$GITHUB_ENV"
      - run: cargo test -p scout-vault-core --locked
      - name: Testes contra o servidor
        run: cargo test -p scout-vault-core --test live_server --locked -- --ignored --test-threads=1

  extension:
    name: Extensão do navegador
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sintaxe do JavaScript e do manifest
        run: |
          for f in extension/*.js; do node --check "$f"; done
          python3 -m json.tool extension/manifest.json > /dev/null
