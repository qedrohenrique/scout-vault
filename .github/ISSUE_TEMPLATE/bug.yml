name: Something doesn't work
description: An error, crash or odd behavior in the app or the extension.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste passwords, codes, tokens or vault contents here.**
        Security issue? Use private reporting (see SECURITY.md), not this issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: "Version (Settings → About), the installer or zip name (e.g. scout-vault-0.11.2-setup.exe) or the commit."
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - bitwarden.com
        - bitwarden.eu
        - Vaultwarden
        - Other self-hosted
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happened
      multiple: true
      options:
        - Login / unlock
        - Vault (list, detail, editing)
        - Attachments
        - Folders / organizations
        - Browser extension
        - Fill in apps (Ctrl+Alt+A)
        - Tray / Windows Hello
        - Other
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: Step by step to make it happen again.
      placeholder: |
        1. I opened…
        2. I clicked…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows and browser
      placeholder: Windows 11 24H2, Chrome 142
