name: Ideia ou pedido
description: Algo que o Scout Vault poderia fazer (ou fazer melhor).
labels: ["ideia"]
body:
  - type: markdown
    attributes:
      value: Antes, dê uma olhada no [roadmap](https://github.com/qedrohenrique/scout-vault/blob/main/docs/ROADMAP.md) — pode já estar planejado.
  - type: textarea
    id: problema
    attributes:
      label: O que você quer fazer e hoje não dá
    validations:
      required: true
  - type: textarea
    id: ideia
    attributes:
      label: Como imagina que funcionaria
  - type: textarea
    id: outros
    attributes:
      label: Como outros gerenciadores fazem (se souber)
