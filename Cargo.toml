[workspace]
resolver = "2"
members = ["crates/scout-vault-core", "crates/scout-vault-app"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# A KDF (Argon2/PBKDF2) e o RSA são lentíssimos sem otimização.
# Otimiza só essas dependências, mesmo em builds de debug.
[profile.dev.package]
argon2.opt-level = 3
blake2.opt-level = 3
pbkdf2.opt-level = 3
sha2.opt-level = 3
hmac.opt-level = 3
aes.opt-level = 3
rsa.opt-level = 3
crypto-bigint.opt-level = 3

[profile.release]
# Binário menor na release (sem símbolos de depuração).
strip = true
