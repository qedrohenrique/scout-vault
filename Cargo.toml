[workspace]
resolver = "2"
members = ["crates/cofre-core", "crates/cofre-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
cofre-core = { path = "crates/cofre-core" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
