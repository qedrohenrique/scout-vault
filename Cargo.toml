[workspace]
resolver = "2"
members = ["crates/scout-vault-core", "crates/scout-vault-app"]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The KDF (Argon2/PBKDF2) and RSA are extremely slow without optimization.
# Optimize just these dependencies, even in debug builds.
[profile.dev.package]
argon2.opt-level = 3
blake2.opt-level = 3
pbkdf2.opt-level = 3
sha2.opt-level = 3
hmac.opt-level = 3
aes.opt-level = 3
rsa.opt-level = 3
crypto-bigint.opt-level = 3

# Dependencies (GPUI is huge) only carry line tables in debug builds: full debug info
# for everything made the UI tests' PDB outgrow the Windows linker (LNK1140). Our own
# crates keep full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
# Smaller release binary (no debug symbols).
strip = true
